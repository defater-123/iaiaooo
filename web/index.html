<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VPS Manager</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: var(--tg-theme-bg-color, #0d1117);
            --fg: var(--tg-theme-text-color, #e6edf3);
            --secondary: var(--tg-theme-secondary-bg-color, #161b22);
            --border: var(--tg-theme-hint-color, #30363d);
            --accent: var(--tg-theme-button-color, #58a6ff);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --success: #3fb950;
            --warning: #f0883e;
            --danger: #f85149;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            overflow: hidden;
        }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ ========== */
        .header {
            background: var(--secondary);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .header .server-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text);
            font-size: 1.2rem;
        }
        .header .info {
            flex: 1;
        }
        .header .info .name {
            font-weight: 600;
            font-size: 1rem;
        }
        .header .info .status {
            font-size: 0.75rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .info .status .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .header .ip {
            font-size: 0.75rem;
            color: var(--tg-theme-hint-color, #8b949e);
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 12px;
            font-family: monospace;
        }

        /* ========== СТАТИСТИКА ========== */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            flex-shrink: 0;
        }
        .stat-card {
            background: var(--secondary);
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card .number {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .stat-card .label {
            font-size: 0.6rem;
            color: var(--tg-theme-hint-color, #8b949e);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .stat-card .number.green { color: var(--success); }
        .stat-card .number.orange { color: var(--warning); }
        .stat-card .number.blue { color: var(--accent); }

        /* ========== ТАБЫ ========== */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--secondary);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--tg-theme-hint-color, #8b949e);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--bg);
            color: var(--fg);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.05);
        }

        /* ========== ПАНЕЛИ ========== */
        .panels {
            flex: 1;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--secondary);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .panel.active {
            display: flex;
        }

        /* ========== ФАЙЛОВАЯ СИСТЕМА ========== */
        .panel-header {
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            background: var(--bg);
        }
        .panel-header .path {
            font-size: 0.75rem;
            color: var(--tg-theme-hint-color, #8b949e);
            font-family: monospace;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .panel-header .path i {
            margin-right: 6px;
        }
        .panel-header .refresh-btn {
            background: none;
            border: none;
            color: var(--tg-theme-hint-color, #8b949e);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .panel-header .refresh-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--fg);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .file-item:hover {
            background: rgba(255,255,255,0.03);
        }
        .file-item .icon {
            width: 28px;
            text-align: center;
            font-size: 1rem;
        }
        .file-item .icon.dir { color: var(--warning); }
        .file-item .icon.file { color: var(--accent); }
        .file-item .icon.exe { color: var(--success); }
        .file-item .icon.img { color: #d2a8ff; }
        .file-item .icon.zip { color: #f0883e; }

        .file-item .name {
            flex: 1;
            font-size: 0.9rem;
        }
        .file-item .size {
            font-size: 0.75rem;
            color: var(--tg-theme-hint-color, #8b949e);
        }
        .file-item .perms {
            font-size: 0.6rem;
            color: var(--tg-theme-hint-color, #8b949e);
            font-family: monospace;
            padding: 2px 6px;
            background: var(--bg);
            border-radius: 4px;
        }
        .file-item .actions {
            display: flex;
            gap: 6px;
        }
        .file-item .actions button {
            background: none;
            border: none;
            color: var(--tg-theme-hint-color, #8b949e);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .file-item .actions button:hover {
            background: rgba(255,255,255,0.05);
            color: var(--fg);
        }
        .file-item .actions button.danger:hover {
            color: var(--danger);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--tg-theme-hint-color, #8b949e);
            gap: 12px;
        }
        .loading i {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--tg-theme-hint-color, #8b949e);
            gap: 12px;
        }
        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
        }

        /* ========== ТЕРМИНАЛ ========== */
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            background: #0a0c10;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .terminal-output .line {
            display: block;
        }
        .terminal-output .prompt {
            color: var(--success);
        }
        .terminal-output .command {
            color: #f0e6d0;
        }
        .terminal-output .output {
            color: #b1bac4;
        }
        .terminal-output .error {
            color: var(--danger);
        }

        .terminal-input {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
        }
        .terminal-input .prompt-symbol {
            color: var(--success);
            font-weight: 600;
            font-family: monospace;
            padding-top: 8px;
        }
        .terminal-input input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--fg);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .terminal-input input:focus {
            border-color: var(--accent);
        }
        .terminal-input input::placeholder {
            color: var(--tg-theme-hint-color, #484f58);
        }
        .terminal-input button {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            color: var(--accent-text);
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        .terminal-input button:hover {
            opacity: 0.85;
        }
        .terminal-input button:active {
            transform: scale(0.97);
        }

        /* ========== СКРОЛЛ ========== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 480px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .header .ip {
                font-size: 0.6rem;
                padding: 2px 8px;
            }
            .file-item {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
            .file-item .perms {
                display: none;
            }
            .terminal-output {
                font-size: 0.7rem;
                padding: 8px 10px;
            }
            .tab-btn {
                font-size: 0.7rem;
                padding: 6px 8px;
            }
            .stat-card .number {
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .stat-card {
                padding: 6px 4px;
            }
            .stat-card .number {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<!-- ============================================================ -->
<!-- ВЕРХНЯЯ ПАНЕЛЬ -->
<!-- ============================================================ -->
<div class="header">
    <div class="server-icon">
        <i class="fas fa-server"></i>
    </div>
    <div class="info">
        <div class="name" id="serverName">VPS · Linux</div>
        <div class="status">
            <span class="dot"></span>
            <span id="serverStatus">онлайн</span>
        </div>
    </div>
    <div class="ip" id="serverIp">10.0.0.1</div>
</div>

<!-- ============================================================ -->
<!-- СТАТИСТИКА -->
<!-- ============================================================ -->
<div class="stats">
    <div class="stat-card">
        <div class="number blue" id="statCpu">0%</div>
        <div class="label">CPU</div>
    </div>
    <div class="stat-card">
        <div class="number green" id="statRam">0/0</div>
        <div class="label">RAM</div>
    </div>
    <div class="stat-card">
        <div class="number orange" id="statDisk">0%</div>
        <div class="label">Диск</div>
    </div>
    <div class="stat-card">
        <div class="number blue" id="statUptime">0м</div>
        <div class="label">Uptime</div>
    </div>
</div>

<!-- ============================================================ -->
<!-- ТАБЫ -->
<!-- ============================================================ -->
<div class="tabs">
    <button class="tab-btn active" data-tab="files">
        <i class="fas fa-folder"></i> Файлы
    </button>
    <button class="tab-btn" data-tab="terminal">
        <i class="fas fa-terminal"></i> Терминал
    </button>
</div>

<!-- ============================================================ -->
<!-- ПАНЕЛИ -->
<!-- ============================================================ -->
<div class="panels">

    <!-- ============ ПАНЕЛЬ ФАЙЛОВ ============ -->
    <div class="panel active" id="panel-files">
        <div class="panel-header">
            <i class="fas fa-folder-open" style="color: var(--warning);"></i>
            <span class="path" id="currentPath"><i class="fas fa-home"></i> /home/user</span>
            <button class="refresh-btn" onclick="refreshFiles()" title="Обновить">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        <div class="file-list" id="fileList">
            <div class="loading"><i class="fas fa-spinner"></i> Загрузка...</div>
        </div>
    </div>

    <!-- ============ ПАНЕЛЬ ТЕРМИНАЛА ============ -->
    <div class="panel" id="panel-terminal">
        <div class="panel-header">
            <i class="fas fa-terminal" style="color: var(--success);"></i>
            <span style="font-size:0.8rem; color: var(--tg-theme-hint-color, #8b949e);">
                <i class="fas fa-circle" style="color: var(--success); font-size: 0.5rem;"></i> активен
            </span>
            <button class="refresh-btn" onclick="clearTerminal()" title="Очистить" style="margin-left: auto;">
                <i class="fas fa-eraser"></i>
            </button>
        </div>
        <div class="terminal-output" id="terminalOutput">
            <span class="line"><span class="prompt">user@vps:~$</span> <span class="command">echo "Добро пожаловать в VPS Manager!"</span></span>
            <span class="line output">Добро пожаловать в VPS Manager!</span>
            <span class="line"><span class="prompt">user@vps:~$</span> <span class="command">help</span></span>
            <span class="line output">Доступные команды: ls, pwd, whoami, date, uptime, echo, clear, help, neofetch, df, free</span>
            <span class="line"><span class="prompt">user@vps:~$</span> <span class="command">█</span></span>
        </div>
        <div class="terminal-input">
            <span class="prompt-symbol">$</span>
            <input type="text" id="terminalInput" placeholder="введите команду..." autofocus>
            <button onclick="sendCommand()"><i class="fas fa-arrow-right"></i></button>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- СКРИПТЫ -->
<!-- ============================================================ -->
<script>
    // ================================================================
    // 1. TELEGRAM WEB APP ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    const tg = window.Telegram.WebApp;
    tg.expand();  // Растягиваем на весь экран
    tg.enableClosingConfirmation();

    // ================================================================
    // 2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
    // ================================================================
    const API_BASE = window.location.origin;
    let currentPath = '/home/user';
    let userId = tg.initDataUnsafe?.user?.id || 123456789;
    let username = tg.initDataUnsafe?.user?.username || 'user';
    let isTrusted = false;

    // Обновляем имя пользователя
    document.getElementById('serverName').textContent = `VPS · ${username}`;

    // ================================================================
    // 3. API ВЫЗОВЫ
    // ================================================================
    async function apiCall(endpoint, method = 'GET', data = null) {
        const options = {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-User-ID': userId,
                'X-Username': username
            }
        };
        if (data) {
            options.body = JSON.stringify(data);
        }
        try {
            const response = await fetch(`${API_BASE}/api/${endpoint}`, options);
            return await response.json();
        } catch (e) {
            console.error('API Error:', e);
            return { error: 'Connection error' };
        }
    }

    // ================================================================
    // 4. ФАЙЛОВАЯ СИСТЕМА
    // ================================================================
    let currentFiles = [];

    async function refreshFiles() {
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Загрузка...</div>';

        const result = await apiCall(`files?path=${encodeURIComponent(currentPath)}`);
        
        if (result.error) {
            fileList.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>${result.error}</div>`;
            return;
        }

        if (result.files && result.files.length > 0) {
            currentFiles = result.files;
            renderFiles(result.files);
        } else {
            fileList.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i>Папка пуста</div>';
        }
    }

    function renderFiles(files) {
        const fileList = document.getElementById('fileList');
        let html = '';

        // Кнопка "Назад" если не в корне
        if (currentPath !== '/home/user') {
            html += `
                <div class="file-item" onclick="navigateUp()">
                    <span class="icon dir"><i class="fas fa-arrow-up"></i></span>
                    <span class="name">..</span>
                    <span class="size"></span>
                    <span class="perms"></span>
                </div>
            `;
        }

        // Сортируем: папки сверху
        files.sort((a, b) => {
            if (a.is_dir && !b.is_dir) return -1;
            if (!a.is_dir && b.is_dir) return 1;
            return a.name.localeCompare(b.name);
        });

        for (const file of files) {
            const icon = getFileIcon(file);
            const size = file.is_dir ? '' : formatSize(file.size);
            const perms = file.permissions || 'rw-r--r--';

            html += `
                <div class="file-item" ${file.is_dir ? `onclick="navigateTo('${file.name}')"` : ''}>
                    <span class="icon ${file.is_dir ? 'dir' : 'file'}">${icon}</span>
                    <span class="name">${file.name}</span>
                    <span class="size">${size}</span>
                    <span class="perms">${perms}</span>
                    <span class="actions">
                        ${!file.is_dir ? `<button onclick="downloadFile('${file.name}')" title="Скачать"><i class="fas fa-download"></i></button>` : ''}
                        <button class="danger" onclick="deleteFile('${file.name}')" title="Удалить"><i class="fas fa-trash"></i></button>
                    </span>
                </div>
            `;
        }

        fileList.innerHTML = html;
    }

    function getFileIcon(file) {
        const name = file.name.toLowerCase();
        if (file.is_dir) return '<i class="fas fa-folder"></i>';
        if (name.endsWith('.sh') || name.endsWith('.bash')) return '<i class="fas fa-terminal" style="color:#3fb950;"></i>';
        if (name.endsWith('.py')) return '<i class="fab fa-python" style="color:#58a6ff;"></i>';
        if (name.endsWith('.js') || name.endsWith('.json')) return '<i class="fab fa-js" style="color:#f7df1e;"></i>';
        if (name.endsWith('.html') || name.endsWith('.css')) return '<i class="fab fa-html5" style="color:#e34f26;"></i>';
        if (name.endsWith('.jpg') || name.endsWith('.png') || name.endsWith('.gif')) return '<i class="fas fa-image" style="color:#d2a8ff;"></i>';
        if (name.endsWith('.zip') || name.endsWith('.tar.gz') || name.endsWith('.rar')) return '<i class="fas fa-file-archive" style="color:#f0883e;"></i>';
        if (name.includes('readme')) return '<i class="fas fa-file-alt" style="color:#58a6ff;"></i>';
        return '<i class="fas fa-file"></i>';
    }

    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function navigateTo(dir) {
        currentPath = currentPath === '/home/user' ? `/${dir}` : `${currentPath}/${dir}`;
        document.getElementById('currentPath').innerHTML = `<i class="fas fa-folder"></i> ${currentPath}`;
        await refreshFiles();
    }

    async function navigateUp() {
        if (currentPath === '/home/user') return;
        const parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/') || '/home/user';
        document.getElementById('currentPath').innerHTML = `<i class="fas fa-folder"></i> ${currentPath}`;
        await refreshFiles();
    }

    async function deleteFile(name) {
        if (!confirm(`Удалить ${name}?`)) return;
        const result = await apiCall('delete', 'POST', { path: currentPath, name: name });
        if (result.success) {
            await refreshFiles();
        } else {
            alert('Ошибка удаления: ' + (result.error || 'Unknown error'));
        }
    }

    async function downloadFile(name) {
        const result = await apiCall(`download?path=${encodeURIComponent(currentPath)}&name=${encodeURIComponent(name)}`);
        if (result.content) {
            const blob = new Blob([atob(result.content)], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            URL.revokeObjectURL(url);
        } else {
            alert('Ошибка скачивания: ' + (result.error || 'Unknown error'));
        }
    }

    // ================================================================
    // 5. ТЕРМИНАЛ
    // ================================================================
    let terminalHistory = [];
    let historyIndex = -1;

    function addTerminalLine(text, className = 'output') {
        const output = document.getElementById('terminalOutput');
        const line = document.createElement('span');
        line.className = `line ${className}`;
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    }

    function addTerminalCommand(cmd) {
        const output = document.getElementById('terminalOutput');
        const line = document.createElement('span');
        line.className = 'line';
        line.innerHTML = `<span class="prompt">user@vps:~$</span> <span class="command">${escapeHtml(cmd)}</span>`;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendCommand() {
        const input = document.getElementById('terminalInput');
        const cmd = input.value.trim();
        if (!cmd) return;
        input.value = '';

        terminalHistory.push(cmd);
        historyIndex = terminalHistory.length;

        addTerminalCommand(cmd);

        // Локальные команды
        const lower = cmd.toLowerCase().trim();
        if (lower === 'clear' || lower === 'cls') {
            document.getElementById('terminalOutput').innerHTML = '';
            return;
        }

        if (lower === 'help') {
            addTerminalLine('Доступные команды: ls, pwd, whoami, date, uptime, echo, clear, help, neofetch, df, free', 'output');
            return;
        }

        // Отправляем на сервер
        const result = await apiCall('command', 'POST', { command: cmd });
        
        if (result.error) {
            addTerminalLine('Ошибка: ' + result.error, 'error');
        } else if (result.output) {
            const lines = result.output.split('\n');
            for (const line of lines) {
                if (line.trim()) {
                    addTerminalLine(line, 'output');
                }
            }
        } else {
            addTerminalLine('✅ Команда выполнена', 'output');
        }

        document.getElementById('terminalOutput').scrollTop = document.getElementById('terminalOutput').scrollHeight;
    }

    function clearTerminal() {
        document.getElementById('terminalOutput').innerHTML = '';
        addTerminalLine('Терминал очищен', 'output');
        addTerminalLine('', 'output');
        const line = document.createElement('span');
        line.className = 'line';
        line.innerHTML = `<span class="prompt">user@vps:~$</span> <span class="command">█</span>`;
        document.getElementById('terminalOutput').appendChild(line);
    }

    // ================================================================
    // 6. СТАТИСТИКА
    // ================================================================
    async function updateStats() {
        const result = await apiCall('stats');
        if (result.error) return;

        document.getElementById('statCpu').textContent = result.cpu || '0%';
        document.getElementById('statRam').textContent = result.ram || '0/0';
        document.getElementById('statDisk').textContent = result.disk || '0%';
        document.getElementById('statUptime').textContent = result.uptime || '0м';
        document.getElementById('serverIp').textContent = result.ip || '10.0.0.1';
    }

    // ================================================================
    // 7. ТАБЫ
    // ================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');

            const tab = this.dataset.tab;
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${tab}`).classList.add('active');

            if (tab === 'files') {
                refreshFiles();
            }
            if (tab === 'terminal') {
                document.getElementById('terminalInput').focus();
            }
        });
    });

    // ================================================================
    // 8. КЛАВИАТУРНЫЕ СОБЫТИЯ
    // ================================================================
    document.getElementById('terminalInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendCommand();
        }
        if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                document.getElementById('terminalInput').value = terminalHistory[historyIndex] || '';
            }
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex < terminalHistory.length - 1) {
                historyIndex++;
                document.getElementById('terminalInput').value = terminalHistory[historyIndex] || '';
            } else {
                historyIndex = terminalHistory.length;
                document.getElementById('terminalInput').value = '';
            }
        }
    });

    // Клик по панели терминала - фокус на input
    document.getElementById('panel-terminal').addEventListener('click', (e) => {
        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
            document.getElementById('terminalInput').focus();
        }
    });

    // ================================================================
    // 9. ЗАПУСК
    // ================================================================
    async function init() {
        // Проверяем доступ
        const auth = await apiCall('auth');
        isTrusted = auth.trusted || false;

        if (!isTrusted) {
            // Если нет доступа - показываем сообщение
            document.getElementById('fileList').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock"></i>
                    <div>Нет доступа к серверу</div>
                    <div style="font-size:0.7rem; margin-top:8px;">Отправьте код боту для получения доступа</div>
                </div>
            `;
            document.getElementById('terminalOutput').innerHTML = `
                <span class="line error">⛔ Нет доступа к серверу</span>
                <span class="line output">Отправьте код боту для получения доступа</span>
            `;
            document.getElementById('serverStatus').textContent = 'нет доступа';
            document.querySelector('.header .info .status .dot').style.background = '#f85149';
            return;
        }

        // Загружаем данные
        await refreshFiles();
        await updateStats();
        setInterval(updateStats, 5000);

        // Фокус на терминал
        document.getElementById('terminalInput').focus();
    }

    init();
</script>

</body>
</html>
