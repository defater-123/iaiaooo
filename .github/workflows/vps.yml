name: Бесплатный VPS через Tailscale

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Установка Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Подключение к Tailscale сети
        run: |
          sudo tailscaled &
          sleep 8
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-runner

      - name: Создание SSH ключа для подключения
        run: |
          # Создаем SSH ключ
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
          # Добавляем публичный ключ в authorized_keys
          mkdir -p ~/.ssh
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          # Показываем ПРИВАТНЫЙ ключ для скачивания
          echo "=================================================="
          echo "🔑 Скачайте этот ПРИВАТНЫЙ ключ (сохраните в файл):"
          echo "=================================================="
          cat ~/.ssh/id_ed25519
          echo "=================================================="
          echo "📝 Публичный ключ уже добавлен на сервер."
          echo "Сохраните приватный ключ в файл (например, key.txt)"
          echo "И подключайтесь командой:"
          echo "ssh -i key.txt runner@$(tailscale ip -4)"
          echo "=================================================="

      - name: Показываем IP адрес
        run: |
          echo "=================================================="
          echo "✅ Ваш VPS готов! Подключайтесь по SSH:"
          echo "ssh -i /путь/к/ключу runner@$(tailscale ip -4)"
          echo "=================================================="

      - name: Держим раннер активным
        run: sleep 21600
