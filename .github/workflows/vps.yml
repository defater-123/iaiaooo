name: GitHub VPS Server

on:
  workflow_dispatch:  # Ручной запуск
  schedule:
    - cron: '55 */5 * * *'  # Каждые 5 часов 55 минут

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5 часов 50 минут
    
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 8
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-vps

      - name: Setup SSH password
        run: |
          PASSWORD="GitHubVPS2026"
          echo "runner:$PASSWORD" | sudo chpasswd
          echo "✅ Password set: $PASSWORD"

      - name: Show connection info
        run: |
          IP=$(tailscale ip -4)
          echo "=================================================="
          echo "          ✅ VPS IS READY ✅"
          echo "=================================================="
          echo ""
          echo "  🌐 IP ADDRESS:  $IP"
          echo "  🔑 PASSWORD:    GitHubVPS2026"
          echo "  👤 USER:        runner"
          echo ""
          echo "=================================================="
          echo "  SSH COMMAND:"
          echo "  ssh runner@$IP"
          echo "=================================================="
          echo ""
          echo "  ✅ Server will run for ~5 hours 50 minutes"
          echo "  🔄 Auto-restart every 5 hours 55 minutes"
          echo "=================================================="

      - name: Keep alive
        run: sleep 21000  # 5 часов 50 минут
