name: GitHub VPS

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 8
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-runner

      - name: Setup password and show all data
        run: |
          # Устанавливаем пароль
          PASSWORD="GitHubVPS2026"
          echo "runner:$PASSWORD" | sudo chpasswd
          
          # Получаем IP
          IP=$(tailscale ip -4)
          
          # Выводим всё красиво
          echo "=================================================="
          echo "          ✅ ВСЁ ГОТОВО! ✅"
          echo "=================================================="
          echo ""
          echo "  🌐 IP АДРЕС:  $IP"
          echo "  🔑 ПАРОЛЬ:    $PASSWORD"
          echo ""
          echo "=================================================="
          echo "  КОМАНДА ДЛЯ ПОДКЛЮЧЕНИЯ:"
          echo "  ssh runner@$IP"
          echo "  Пароль: $PASSWORD"
          echo "=================================================="
          echo ""
          echo "  СОХРАНИТЕ ЭТИ ДАННЫЕ!"
          echo "  IP: $IP"
          echo "  Пароль: $PASSWORD"
          echo "=================================================="

      - name: Keep alive
        run: sleep 21600
