name: 🚀 Автоматический VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */5 * * *'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Восстанавливаем пользователей
        run: |
          if [ -d "Saves/user" ]; then
            echo "✅ Пользователи загружены:"
            ls -la Saves/user/
          else
            echo "ℹ️ Нет сохраненных пользователей"
            mkdir -p Saves/user
          fi
      
      - name: Устанавливаем Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install -r bot/requirements.txt
      
      - name: Генерируем код доступа
        id: generate
        run: |
          ACCESS_CODE=$(openssl rand -hex 4 | tr 'a-f' 'A-F')
          SSH_PASSWORD=$(openssl rand -base64 15 | tr -d '/+=')
          
          echo "ACCESS_CODE=$ACCESS_CODE" >> $GITHUB_ENV
          echo "SSH_PASSWORD=$SSH_PASSWORD" >> $GITHUB_ENV
          
          echo "runner:$SSH_PASSWORD" | sudo chpasswd
          
          echo "✅ Код сгенерирован: $ACCESS_CODE"
      
      - name: Получаем IP адрес
        id: ip
        run: |
          IP=$(curl -s ifconfig.me)
          echo "SERVER_IP=$IP" >> $GITHUB_ENV
          echo "🌐 Публичный IP: $IP"
      
      - name: Регистрируем код в боте
        run: |
          python3 bot/central_bot.py \
            --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --add-code "$ACCESS_CODE:$SERVER_IP:$SSH_PASSWORD"
          
          echo "✅ Код зарегистрирован: $ACCESS_CODE"
      
      - name: Запускаем Telegram бота
        run: |
          python3 bot/central_bot.py \
            --token "${{ secrets.TELEGRAM_BOT_TOKEN }}" &
          
          sleep 3
          echo "✅ Бот запущен в фоне"
      
      - name: Информация для пользователя
        run: |
          echo "=================================================="
          echo "          ✅ VPS ГОТОВ К РАБОТЕ ✅"
          echo "=================================================="
          echo ""
          echo "  🤖 БОТ: @${{ secrets.BOT_USERNAME }}"
          echo "  🔑 КОД: $ACCESS_CODE"
          echo "  🌐 IP:   $SERVER_IP"
          echo "  👤 ПОЛЬЗОВАТЕЛЬ: runner"
          echo "  🔑 ПАРОЛЬ: $SSH_PASSWORD"
          echo ""
          echo "=================================================="
          echo "  📱 ИНСТРУКЦИЯ:"
          echo "  1. Открой Telegram"
          echo "  2. Найди @${{ secrets.BOT_USERNAME }}"
          echo "  3. Отправь код: $ACCESS_CODE"
          echo "  4. Получи SSH доступ!"
          echo ""
          echo "  💾 ПОЛЬЗОВАТЕЛИ СОХРАНЯЮТСЯ В РЕПОЗИТОРИЙ!"
          echo "  🔄 При перезапуске доступ восстанавливается!"
          echo "=================================================="
      
      - name: Сохраняем изменения
        run: |
          git config --global user.email "vps-bot@github.com"
          git config --global user.name "VPS Bot"
          
          git add Saves/
          
          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений"
          else
            git commit -m "Сохранить данные пользователей [skip ci]"
            git push
            echo "✅ Изменения сохранены"
          fi
      
      # ============================================================
      # ⭐ ПЕРЕЗАПУСК ПЕРЕД ВЫКЛЮЧЕНИЕМ
      # ============================================================
      - name: 🔄 Запускаем новый workflow перед выключением
        run: |
          echo "=================================================="
          echo "  🔄 ЗАПУСК НОВОГО WORKFLOW"
          echo "=================================================="
          
          # Ждем 1 минуту (запас)
          echo "⏳ Ожидание 60 секунд..."
          sleep 60
          
          # Запускаем keepalive workflow через GitHub API
          echo "🚀 Запуск VPS Keep Alive..."
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/vps-keepalive.yml/dispatches \
            -d '{"ref":"main"}'
          
          echo "✅ Новый workflow запущен!"
          echo "⏳ Ожидание 30 секунд для запуска..."
          sleep 30
          
          echo "✅ Передача управления завершена"
          echo "=================================================="
      
      - name: Keep alive
        run: sleep 21000
