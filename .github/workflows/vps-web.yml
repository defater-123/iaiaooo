name: 🚀 VPS Web Server

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */5 * * *'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Генерируем код доступа
        run: |
          ACCESS_CODE=$(openssl rand -hex 4 | tr 'a-f' 'A-F')
          SSH_PASSWORD=$(openssl rand -base64 15 | tr -d '/+=')

          echo "ACCESS_CODE=$ACCESS_CODE" >> $GITHUB_ENV
          echo "SSH_PASSWORD=$SSH_PASSWORD" >> $GITHUB_ENV

          echo "runner:$SSH_PASSWORD" | sudo chpasswd
          echo "✅ Код сгенерирован: $ACCESS_CODE"

      - name: Получаем IP адрес
        run: |
          IP=$(curl -s ifconfig.me)
          echo "SERVER_IP=$IP" >> $GITHUB_ENV
          echo "🌐 Публичный IP: $IP"

      - name: Регистрируем код в веб-сервере
        run: |
          python3 web/server.py --add-code "$ACCESS_CODE:$SERVER_IP:$SSH_PASSWORD"
          echo "✅ Код зарегистрирован: $ACCESS_CODE"

      - name: Запускаем веб-панель
        run: |
          nohup python3 web/server.py --port 8080 > web.log 2>&1 &
          sleep 3
          curl -s http://localhost:8080/api/config && echo ""
          echo "✅ Веб-сервер запущен на порту 8080"

      - name: Открываем публичный URL (cloudflared tunnel)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "🔗 Публичный адрес панели: $TUNNEL_URL"

      - name: Информация для пользователя
        run: |
          echo "=================================================="
          echo "         ✅ VPS WEB-ПАНЕЛЬ ГОТОВА ✅"
          echo "=================================================="
          echo ""
          echo "  🌍 САЙТ:          $TUNNEL_URL"
          echo "  🔑 КОД ДОСТУПА:   $ACCESS_CODE"
          echo "  🌐 IP:            $SERVER_IP"
          echo "  👤 ПОЛЬЗОВАТЕЛЬ:  runner"
          echo "  🔑 ПАРОЛЬ SSH:    $SSH_PASSWORD"
          echo ""
          echo "=================================================="
          echo "  📱 ИНСТРУКЦИЯ:"
          echo "  1. Открой в браузере: $TUNNEL_URL"
          echo "  2. Введи код доступа: $ACCESS_CODE"
          echo "  3. Управляй сервером:"
          echo "     • Дашборд — CPU / RAM / Disk / Uptime"
          echo "     • Файлы — файловая структура (создать,"
          echo "       редактировать, удалить, скачать, загрузить)"
          echo "     • Терминал — команды с потоковым выводом"
          echo ""
          echo "  💾 Данные сохраняются в репозиторий (Saves/)"
          echo "  ⏱️ Сервер активен ~6 часов"
          echo "  🔄 Панель доступна до конца работы Action"
          echo "=================================================="

      - name: Сохраняем изменения в репозиторий
        run: |
          git config --global user.email "vps-web@github.com"
          git config --global user.name "VPS Web"

          git add Saves/ || true

          if git diff --staged --quiet; then
            echo "ℹ️ Нет изменений для сохранения"
          else
            git commit -m "Сохранить данные пользователей [skip ci]"
            git push
            echo "✅ Изменения сохранены в репозиторий"
          fi

      - name: Keep alive (следим за сервером и туннелем)
        run: |
          echo "🔄 Хранитель активен: панель будет держать сервер живым ~5.5 часов."
          echo ""
          echo "⚠️  ВАЖНО: код доступа живёт 15 минут после запуска Action."
          echo "   Если видите «истёк» — откройте этот лог заново (страница Action"
          echo "   обновляется на лету): ниже каждые ~5 минут печатается актуальный"
          echo "   статус, а при перезапуске панели генерируется НОВЫЙ код."
          echo ""
          END_TIME=$(( $(date +%s) + 20400 ))
          LAST_REPORT=0
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            sleep 60

            # Пуш сохранённых данных (файлы, сессии) в репозиторий
            git add Saves/ web.log 2>/dev/null || true
            if ! git diff --staged --quiet 2>/dev/null; then
              git commit -m "Автосохранение [skip ci]" >/dev/null 2>&1 || true
              git push >/dev/null 2>&1 || true
            fi

            # Проверка живости веб-сервера
            if ! curl -sf http://localhost:8080/api/config >/dev/null 2>&1; then
              echo "🔁 Сервер не отвечает — перезапускаю..."
              nohup python3 web/server.py --port 8080 >> web.log 2>&1 &
              sleep 3
              # Регистрируем НОВЫЙ код, чтобы доступ можно было получить заново
              NEW_CODE=$(openssl rand -hex 4 | tr 'a-f' 'A-F')
              python3 web/server.py --add-code "$NEW_CODE:$SERVER_IP:$SSH_PASSWORD" || true
              echo "🌍 САЙТ: $TUNNEL_URL"
              echo "🔑 НОВЫЙ КОД ДОСТУПА: $NEW_CODE (живёт 15 минут)"
              echo "$NEW_CODE" > /tmp/vps_new_code
              # Проверяем туннель
              if ! pgrep -f cloudflared >/dev/null 2>&1; then
                nohup ./cloudflared tunnel --url http://localhost:8080 >> tunnel.log 2>&1 &
                sleep 8
                NEW_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | tail -1)
                [ -n "$NEW_URL" ] && TUNNEL_URL="$NEW_URL" && echo "🌍 Новый URL туннеля: $TUNNEL_URL"
              fi
            fi

            NOW=$(date +%s)

            # Каждые ~2 минуты пуллим изменения из репозитория (merge), чтобы
            # панель обновлялась без остановки Action. При жёстком конфликте —
            # берём нашу версию (-X ours) и продолжаем работать.
            if [ $(( NOW % 2 )) -eq 0 ]; then
              git pull --no-rebase --no-edit -X ours origin "$GITHUB_REF" >/dev/null 2>&1 \
                || { echo "⚠️ Конфликт при авто-merge — пропускаю обновление"; git merge --abort 2>/dev/null || true; }
            fi

            # Каждые ~5 минут — напоминание с актуальными кодами в лог
            if [ $(( NOW - LAST_REPORT )) -ge 300 ]; then
              LAST_REPORT=$NOW
              echo "────────── 📊 Статус панели ──────────"
              echo "🌍 САЙТ: $TUNNEL_URL"
              [ -f /tmp/vps_new_code ] && echo "🔑 ПОСЛЕДНИЙ КОД: $(cat /tmp/vps_new_code)"
              python3 web/server.py --print-codes 2>/dev/null | grep "КОД ДОСТУПА" || echo "🔑 Все коды использованы или истекли (это нормально для активной сессии)"
              echo "⏱ Время сервера: $(python3 -c 'from datetime import datetime,timezone; print(datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"))')"
              echo "──────────────────────────────────────"
            fi
          done
