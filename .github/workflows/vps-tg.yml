name: VPS via Central Bot (No Tailscale)

on:
  workflow_dispatch:
  schedule:
    - cron: '55 */5 * * *'

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate access code
        id: generate
        run: |
          # Генерируем код
          ACCESS_CODE=$(openssl rand -hex 4 | tr 'a-f' 'A-F')
          SSH_PASSWORD=$(openssl rand -base64 15 | tr -d '/+=')
          
          echo "ACCESS_CODE=$ACCESS_CODE" >> $GITHUB_ENV
          echo "SSH_PASSWORD=$SSH_PASSWORD" >> $GITHUB_ENV
          
          # Устанавливаем пароль
          echo "runner:$SSH_PASSWORD" | sudo chpasswd
          
          echo "✅ Код сгенерирован: $ACCESS_CODE"
      
      - name: Get IP address
        id: ip
        run: |
          # Получаем публичный IP
          IP=$(curl -s ifconfig.me)
          echo "IP=$IP" >> $GITHUB_ENV
          echo "Публичный IP: $IP"
      
      - name: Register code (опционально)
        env:
          API_URL: ${{ secrets.CENTRAL_BOT_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "⚠️ API_URL не задан. Код НЕ зарегистрирован автоматически."
            echo "⚠️ Отправьте код боту вручную!"
          else
            # Регистрируем код в центральном боте
            RESPONSE=$(curl -s -X POST "$API_URL/register" \
              -H "Content-Type: application/json" \
              -d '{"code":"'"$ACCESS_CODE"'","ip":"'"$IP"'","password":"'"$SSH_PASSWORD"'"}')
            
            if echo "$RESPONSE" | grep -q "success"; then
              echo "✅ Код зарегистрирован в боте"
            else
              echo "⚠️ Ошибка регистрации: $RESPONSE"
            fi
          fi
      
      - name: Show connection info
        run: |
          echo "=================================================="
          echo "          ✅ VPS IS READY ✅"
          echo "=================================================="
          echo ""
          echo "  🔑 ACCESS CODE: $ACCESS_CODE"
          echo "  🌐 IP ADDRESS:  $IP"
          echo "  👤 USER:        runner"
          echo "  🔑 PASSWORD:    $SSH_PASSWORD"
          echo ""
          echo "=================================================="
          echo "  📱 BOT: @YourBotName"
          echo "  📝 Send code: $ACCESS_CODE"
          echo "=================================================="
          echo ""
          echo "  🔹 SSH COMMAND:"
          echo "  ssh runner@$IP"
          echo "=================================================="
      
      - name: Keep alive
        run: sleep 21000
